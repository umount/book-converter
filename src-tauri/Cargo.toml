[package]
name = "book-converter"
version = "0.1.0"
edition = "2021"
description = "Translate large books (Chinese → Russian) via the DeepSeek API, GUI on Tauri + React"
license = "MIT"

# The Rust core builds both as a library (for Tauri commands) and as a binary.
[lib]
name = "book_converter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# --- Tauri ---
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"    # book file picker
tauri-plugin-opener = "2"    # open the produced file in the system

# --- Async runtime and HTTP ---
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Progress storage ---
rusqlite = { version = "0.32", features = ["bundled"] }

# --- Parsing / splitting ---
regex = "1"
encoding_rs = "0.8"    # decode bytes → UTF-8 for a detected encoding
chardetng = "0.1"      # detect the source encoding (GBK, Big5, UTF-8, …)
quick-xml = "0.36"     # parse FB2 (FictionBook XML) input and reference

# --- Archives ---
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"        # cover image ↔ base64 (FB2 <binary>, data URLs, EPUB)

# --- Export ---
epub-builder = "0.7"
genpdf = { version = "0.2", features = ["images"] }  # PDF output (with cover image)
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }  # normalize cover → JPEG for PDF
pdf-extract = "0.12"   # PDF input (pure-Rust text extraction fallback)
lopdf = "0.42"         # PDF outline (TOC), cover image, and Info-metadata patching
pdfium-render = "0.8"  # cross-platform PDF text via a bundled pdfium (preferred)

# --- Config ---
dotenvy = "0.15"       # load DEEPSEEK_API_KEY from a local .env at startup

# --- Errors and logging ---
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
