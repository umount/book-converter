[package]
name = "manga-inference"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[features]
default = []
onnx = ["dep:ort", "lettering"]
lettering = ["dep:fontdue", "dep:rustybuzz", "dep:unicode-linebreak"]
worker = ["dep:tokio", "dep:tracing"]

[dependencies]
tracing = { version = "0.1", optional = true }
fontdue = { version = "0.9.4", optional = true }
rustybuzz = { version = "0.20.1", optional = true }
unicode-linebreak = { version = "0.1.5", optional = true }
tokio = { version = "1", features = ["process", "io-util", "time", "rt", "macros", "sync"], optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"], optional = true }

[[bin]]
name = "manga-inference"
path = "src/main.rs"
required-features = ["onnx"]
