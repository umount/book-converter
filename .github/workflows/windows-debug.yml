name: Windows diagnostic installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build diagnostic installer with native manga resources
        shell: pwsh
        run: ./scripts/build-debug-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: book-converter-windows-debug
          path: src-tauri/target/x86_64-pc-windows-msvc/debug/bundle/nsis/*.exe
          if-no-files-found: error
